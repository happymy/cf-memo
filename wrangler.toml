name = "cf-memo"
main = "src/index.js"
compatibility_date = "2025-01-01"

# KV 命名空间 - 部署前需先创建
# 运行: wrangler kv ！namespace create MEMOS_KV
# 然后将输出的 id 替换下方的占位符
kv_namespaces = [
  { binding = "MEMOS_KV", id = "009449e6020d4b06919f14439690bf12" }
]

# 环境变量 - 预设登录凭证和会话密钥
# 部署时设置实际值:
# wrangler secret put USERNAME
# wrangler secret put PASSWORD
# wrangler secret put SESSION_SECRET
# wrangler secret put HIDDEN_PASSWORD   # 隐藏备忘录独立密码，未设置时隐藏功能返回 500
# MEMO_ENCRYPT_KEY 请用 wrangler secret 设置，格式: 32 字节 key 的 base64（如 .env）
[vars]
# 以下仅为本地开发使用，生产环境请用 wrangler secret 设置
# USERNAME = "admin"
# PASSWORD = "memo2024"
# SESSION_SECRET = "your-random-secret-string-change-me"
